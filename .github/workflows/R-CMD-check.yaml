name: R-CMD-check

# `R CMD check` gate.
#
# tests.yml runs the full testthat suite, but the suite is blind to most of what
# check looks at. testthat never runs examples, so a broken roxygen example is
# invisible to it; and nothing in the suite looks at Rd cross-references,
# non-ASCII source, the DESCRIPTION license pointer, or whether man/ still
# matches R/. All of those had silently drifted on main before this gate
# existed -- including a maintainer ORCID missing from the rendered docs and an
# example that errored.
#
# error-on: "warning" fails on any ERROR or WARNING while tolerating NOTEs.
# Exactly two NOTEs are expected, and both are known non-defects:
#
#   * "Namespace in Imports field not imported from: 'datasets'" -- a false
#     positive. datasets IS used, at R/geography.R (top-level code) and
#     R/state.R (via asNamespace("datasets")); codetools only scans function
#     bodies, so it sees neither.
#   * "Found the following possibly unsafe calls: unlockBinding" -- required by
#     the warn-on-access deprecated constants installed in R/zzz.R.
#
# A third NOTE means something new -- read it rather than widening this setting.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only: checkout, install dependencies, check the package. No repo writes.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'          # Depends + Imports + Suggests
          extra-packages: any::rcmdcheck

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: '"--no-manual"'          # --no-manual: no LaTeX on the runner
          error-on: '"warning"'
          upload-snapshots: true

  # man/ and NAMESPACE are generated; nothing was verifying they still match R/.
  # They had drifted on main -- the maintainer ORCID was missing from the
  # rendered docs, canon_npi's regex was malformed markup, and the URPS demand
  # family index omitted three functions -- because DESCRIPTION pinned a
  # roxygen2 version nobody had installed, so re-documenting looked like churn
  # and was avoided. Regenerating with the PINNED version makes the pin
  # meaningful: docs must be reproducible from source, and a stale man/ is a
  # failure rather than something you notice months later.
  docs-in-sync:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          extra-packages: any::remotes

      # Read the pin out of DESCRIPTION rather than hardcoding it, so bumping
      # Config/roxygen2/version is all it takes to move this check with it.
      # CRAN's current roxygen2 is NOT the pinned one, and regenerating with a
      # different version rewrites every .Rd -- which would make this job fail
      # on formatting noise instead of real drift.
      - name: Install the roxygen2 version DESCRIPTION pins
        run: |
          Rscript -e '
            pin <- read.dcf("DESCRIPTION")[1, "Config/roxygen2/version"]
            if (is.na(pin) || !nzchar(pin))
              stop("DESCRIPTION has no Config/roxygen2/version to pin to", call. = FALSE)
            cat("DESCRIPTION pins roxygen2", pin, "\n")
            remotes::install_version("roxygen2", version = pin, upgrade = "never")
            stopifnot(identical(as.character(packageVersion("roxygen2")), pin))
          '

      - name: Re-document and fail on drift
        run: |
          Rscript -e 'roxygen2::roxygenise(".")'
          if ! git diff --exit-code -- man NAMESPACE DESCRIPTION; then
            echo "::error title=man/ is out of sync with R/::Generated documentation does not match the roxygen comments in R/ (diff above). Run roxygen2::roxygenise() with the version DESCRIPTION pins and commit the result."
            exit 1
          fi
