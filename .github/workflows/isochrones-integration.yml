name: isochrones-integration

# Cross-repository integration for the URPS workforce contract (v3.0.0).
# Checks out isochrones at the IMMUTABLE artifact commit, serves + validates the
# v3.0.0 artifact through mufflyaccess, runs the canonical API calls, and then
# runs the cliff + twostep consumer tests against the SAME pinned mufflyaccess.
# A miniature fixture cannot detect upstream drift; this job can.
#
# CROSS-REPO ACCESS. This job checks out the PRIVATE sibling repos mufflyt/
# isochrones, mufflyt/cliff, and mufflyt/twostep. The default GITHUB_TOKEN is
# scoped to THIS repo only, so those checkouts 404 ("Repository not found").
# To run the real drift check, set a repository secret CROSS_REPO_RO_TOKEN to a
# token (fine-grained PAT or App token) with Contents:Read on those three repos;
# it is passed to each cross-repo checkout. Nothing here needs write access.
#
# WHEN THE SECRET IS ABSENT the behaviour depends on the event, because a green
# check that means "we did not look" is worse than no check at all -- this job
# previously reported success in 6-11 seconds having skipped every substantive
# step, which is indistinguishable from a real pass on the PR page:
#
#   * pull_request -- skip the cross-repo steps and pass with a notice. PRs from
#     forks cannot read secrets, so failing there would punish contributors for
#     an access problem they cannot fix.
#   * push to main, the weekly cron, manual dispatch -- FAIL LOUDLY. These are
#     exactly the runs whose job is to catch upstream drift, and silently not
#     running is the failure mode this workflow exists to prevent.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 12 * * 1"   # weekly drift check
  workflow_dispatch:

# Read-only: every job just checks out repos, installs, and runs tests.
permissions:
  contents: read

env:
  ISO_ARTIFACT_COMMIT: cf7222df2dba8a75831b372b7787af379a9b799d   # carries artifacts/workforce/ (v3.0.0)
  ISO_SOURCE_COMMIT:   74085a9e695eec5350275a29d8655512ad57422b   # producing source commit

jobs:
  mufflyaccess:
    runs-on: ubuntu-latest
    outputs:
      has_token: ${{ steps.detect.outputs.has_token }}
    steps:
      - name: Detect the cross-repo read token
        id: detect
        env:
          CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_RO_TOKEN }}
        run: |
          if [ -n "$CROSS_REPO_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_token=false" >> "$GITHUB_OUTPUT"

          # Fork PRs cannot read secrets: skip green rather than blaming the
          # contributor for an access problem they cannot fix.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::notice title=isochrones-integration skipped::CROSS_REPO_RO_TOKEN is not readable from a pull_request run, so the private mufflyt/isochrones + cliff + twostep checkouts are skipped and this cross-repo drift check did not run."
            exit 0
          fi

          # On main / the weekly cron / manual dispatch, not running IS the
          # failure. Reporting success here would mean the drift check, the
          # share/acs_sheps staleness gate and the cliff+twostep consumer
          # contract tests all silently never ran.
          echo "::error title=cross-repo drift check did NOT run::CROSS_REPO_RO_TOKEN is not set, so the pinned-artifact validation, the share/acs_sheps staleness gate and the cliff + twostep consumer contract tests were all skipped. This job is failing rather than reporting a green check it did not earn. Set the secret to a token with Contents:Read on mufflyt/isochrones, mufflyt/cliff and mufflyt/twostep."
          exit 1
      - name: Check out mufflyaccess
        if: steps.detect.outputs.has_token == 'true'
        uses: actions/checkout@v4
      - name: Check out the pinned isochrones artifact commit
        if: steps.detect.outputs.has_token == 'true'
        uses: actions/checkout@v4
        with:
          repository: mufflyt/isochrones
          ref: ${{ env.ISO_ARTIFACT_COMMIT }}
          path: isochrones
          token: ${{ secrets.CROSS_REPO_RO_TOKEN }}
      - uses: r-lib/actions/setup-r@v2
        if: steps.detect.outputs.has_token == 'true'
        with: { use-public-rspm: true }
      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.detect.outputs.has_token == 'true'
        with:
          extra-packages: |
            any::testthat
            any::digest
            any::arrow
            any::jsonlite
      - name: Install mufflyaccess
        if: steps.detect.outputs.has_token == 'true'
        run: R CMD INSTALL --with-keep.source .
      - name: Point at the released artifact
        if: steps.detect.outputs.has_token == 'true'
        run: echo "MUFFLYACCESS_URPS_ARTIFACT_DIR=$GITHUB_WORKSPACE/isochrones/artifacts/workforce" >> "$GITHUB_ENV"
      - name: Validate + canonical invariants (strict, fail-closed)
        if: steps.detect.outputs.has_token == 'true'
        run: |
          Rscript -e '
            options(mufflyaccess.urps_artifact_strict = TRUE)
            library(mufflyaccess)
            path <- Sys.getenv("MUFFLYACCESS_URPS_ARTIFACT_DIR")
            stopifnot(nzchar(path), file.exists(file.path(path, "urps_counts_by_year.csv")))
            stopifnot(isTRUE(validate_urps_ssot(
              require_external = TRUE, require_canonical = TRUE,
              require_contract_version = "3.0.0",
              require_source_git_commit = Sys.getenv("ISO_SOURCE_COMMIT"))))
            use_urps_artifact(path)
            stopifnot(urps_count(2023, "board_certified_active", "national", TRUE)  == 1306L)
            stopifnot(urps_count(2023, "board_certified_active", "conus",    TRUE)  == 1303L)
            stopifnot(urps_count(2025, "roster_snapshot",        "national", TRUE)  == 1339L)
            stopifnot(urps_count(2025, "roster_snapshot",        "conus",    TRUE)  == 1336L)
            # retired cells never present as current
            stopifnot(!(urps_count(2023,"board_certified_active","national",TRUE) %in% c(1332L,1329L)))
            stopifnot(setequal(urps_retired_values(), c(1332L,1329L)))
            testthat::test_dir("tests/testthat", filter = "isochrones|contract-lineage", stop_on_failure = TRUE)
            cat("mufflyaccess integration: OK\n")
          '
      - name: Regenerate the ACS/Sheps package (self-invalidating) and check no drift
        if: steps.detect.outputs.has_token == 'true'
        run: |
          pip install pyarrow
          python3 share/acs_sheps/build_state_extract.py isochrones/artifacts/workforce/urps_provider_snapshot.parquet share/acs_sheps/out/urps_state_extract_2023_v3.0.0.csv
          MUFFLYACCESS_URPS_ARTIFACT_DIR=isochrones/artifacts/workforce Rscript share/acs_sheps/build_share_package.R
          git diff --exit-code -- share/acs_sheps/out || (echo "::error::share/acs_sheps outputs are stale; re-run the generators and commit"; exit 1)

  consumers:
    runs-on: ubuntu-latest
    needs: mufflyaccess
    if: needs.mufflyaccess.outputs.has_token == 'true'   # skip cleanly when no cross-repo token
    strategy:
      matrix:
        repo: [cliff, twostep]
    steps:
      - name: Check out mufflyaccess
        uses: actions/checkout@v4
        with: { path: mufflyaccess }
      - name: Check out ${{ matrix.repo }}
        uses: actions/checkout@v4
        with:
          repository: mufflyt/${{ matrix.repo }}
          path: ${{ matrix.repo }}
          token: ${{ secrets.CROSS_REPO_RO_TOKEN }}
      - uses: r-lib/actions/setup-r@v2
        with: { use-public-rspm: true }
      - name: Install this exact mufflyaccess into the consumer
        run: R CMD INSTALL --with-keep.source mufflyaccess
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: ${{ matrix.repo }}
          extra-packages: any::testthat
      - name: Run the consumer's URPS contract + guard tests
        working-directory: ${{ matrix.repo }}
        run: |
          Rscript -e '
            library(testthat)
            testthat::test_dir("tests/testthat",
              filter = "urps|baseline|unqualified|geography|engine|mufflyaccess", stop_on_failure = TRUE)
            cat("${{ matrix.repo }} consumer contract: OK\n")
          '
