name: isochrones-integration

# Cross-repository integration for the URPS workforce contract (v3.0.0).
# Checks out isochrones at the IMMUTABLE artifact commit, serves + validates the
# v3.0.0 artifact through mufflyaccess, runs the canonical API calls, and then
# runs the cliff + twostep consumer tests against the SAME pinned mufflyaccess.
# A miniature fixture cannot detect upstream drift; this job can.
#
# CROSS-REPO ACCESS. This job checks out the PRIVATE sibling repos mufflyt/
# isochrones, mufflyt/cliff, and mufflyt/twostep. The default GITHUB_TOKEN is
# scoped to THIS repo only, so those checkouts 404 ("Repository not found").
# To run the real drift check, set a repository secret CROSS_REPO_RO_TOKEN to a
# token (fine-grained PAT or App token) with Contents:Read on those three repos;
# it is passed to each cross-repo checkout. Nothing here needs write access.
#
# WHEN THE SECRET IS ABSENT the behaviour depends on the event, because a green
# check that means "we did not look" is worse than no check at all -- this job
# previously reported success in 6-11 seconds having skipped every substantive
# step, which is indistinguishable from a real pass on the PR page:
#
#   * pull_request -- skip the cross-repo steps and pass with a notice. PRs from
#     forks cannot read secrets, so failing there would punish contributors for
#     an access problem they cannot fix.
#   * push to main, the weekly cron, manual dispatch -- FAIL LOUDLY. These are
#     exactly the runs whose job is to catch upstream drift, and silently not
#     running is the failure mode this workflow exists to prevent.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 12 * * 1"   # weekly drift check
  workflow_dispatch:

# Read-only: every job just checks out repos, installs, and runs tests.
permissions:
  contents: read

env:
  ISO_ARTIFACT_COMMIT: cf7222df2dba8a75831b372b7787af379a9b799d   # carries artifacts/workforce/ (v3.0.0)
  ISO_SOURCE_COMMIT:   74085a9e695eec5350275a29d8655512ad57422b   # producing source commit

jobs:
  mufflyaccess:
    runs-on: ubuntu-latest
    # RULE: every job needs a timeout. A job timeout CANCELS the job,
    # so `if: always()` steps never run and no artifact survives.
    timeout-minutes: 30
    outputs:
      has_token: ${{ steps.detect.outputs.has_token }}
    steps:
      - name: Detect the cross-repo read token
        id: detect
        env:
          CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_RO_TOKEN }}
        run: |
          if [ -n "$CROSS_REPO_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_token=false" >> "$GITHUB_OUTPUT"

          # Fork PRs cannot read secrets: skip green rather than blaming the
          # contributor for an access problem they cannot fix.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::notice title=isochrones-integration skipped::CROSS_REPO_RO_TOKEN is not readable from a pull_request run, so the private mufflyt/isochrones + cliff + twostep checkouts are skipped and this cross-repo drift check did not run."
            exit 0
          fi

          # On main / the weekly cron / manual dispatch, not running IS the
          # failure. Reporting success here would mean the drift check, the
          # share/acs_sheps staleness gate and the cliff+twostep consumer
          # contract tests all silently never ran.
          echo "::error title=cross-repo drift check did NOT run::CROSS_REPO_RO_TOKEN is not set, so the pinned-artifact validation, the share/acs_sheps staleness gate and the cliff + twostep consumer contract tests were all skipped. This job is failing rather than reporting a green check it did not earn. Set the secret to a token with Contents:Read on mufflyt/isochrones, mufflyt/cliff and mufflyt/twostep."
          exit 1
      - name: Check out mufflyaccess
        if: steps.detect.outputs.has_token == 'true'
        uses: actions/checkout@v4
      - name: Check out the pinned isochrones artifact commit
        if: steps.detect.outputs.has_token == 'true'
        uses: actions/checkout@v4
        with:
          repository: mufflyt/isochrones
          ref: ${{ env.ISO_ARTIFACT_COMMIT }}
          path: isochrones
          token: ${{ secrets.CROSS_REPO_RO_TOKEN }}
      - uses: r-lib/actions/setup-r@v2
        if: steps.detect.outputs.has_token == 'true'
        with: { use-public-rspm: true }
      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.detect.outputs.has_token == 'true'
        with:
          extra-packages: |
            any::testthat
            any::digest
            any::arrow
            any::jsonlite
      - name: Install mufflyaccess
        if: steps.detect.outputs.has_token == 'true'
        run: R CMD INSTALL --with-keep.source .
      - name: Point at the released artifact
        if: steps.detect.outputs.has_token == 'true'
        run: echo "MUFFLYACCESS_URPS_ARTIFACT_DIR=$GITHUB_WORKSPACE/isochrones/artifacts/workforce" >> "$GITHUB_ENV"
      # The in-repo fixture must be byte-identical to what isochrones actually
      # released at the pinned commit. This is not redundant with the validation
      # below, and the token-free share-drift job cannot cover it:
      # build_share_package.R generates the collaborator-facing package from the
      # FIXTURE, so if the fixture ever diverges from the released artifact, the
      # share package is derived from data that was never released -- and every
      # other check would still pass, because each is internally consistent.
      # This is the only place the two are compared.
      - name: Fixture must match the pinned upstream artifact
        if: steps.detect.outputs.has_token == 'true'
        run: |
          Rscript -e '
            fixture <- "tests/testthat/fixtures/isochrones-v3.0.0"
            released <- file.path(Sys.getenv("GITHUB_WORKSPACE"),
                                  "isochrones", "artifacts", "workforce")
            files <- sort(basename(Sys.glob(file.path(fixture, "*"))))
            if (!length(files)) stop("no fixture files found at ", fixture, call. = FALSE)

            problems <- character()
            for (f in files) {
              a <- file.path(fixture, f)
              b <- file.path(released, f)
              if (!file.exists(b)) {
                problems <- c(problems, sprintf("%s: in the fixture but NOT in the released artifact", f))
                next
              }
              if (!identical(unname(tools::md5sum(a)), unname(tools::md5sum(b))))
                problems <- c(problems, sprintf("%s: fixture differs from the released artifact", f))
            }

            if (length(problems)) {
              cat("::error title=fixture has drifted from the released artifact::",
                  paste(problems, collapse = "; "),
                  ". share/acs_sheps is generated from the FIXTURE, so this means the ",
                  "collaborator-facing package is derived from data isochrones never ",
                  "released. Re-copy the artifact from the pinned commit, or move the pin ",
                  "deliberately and regenerate the share package.\n", sep = "")
              stop("fixture/artifact mismatch", call. = FALSE)
            }
            cat("fixture matches the released artifact (", length(files), " files)\n", sep = "")
          '

      # A SECOND isochrones checkout, at main rather than the pinned artifact
      # commit. The pin above is the released data contract; this one is current
      # SOURCE, which is what the promoted-function parity check below needs --
      # comparing against a months-old commit would let live drift through.
      - name: Check out isochrones at main (for promoted-source parity)
        if: steps.detect.outputs.has_token == 'true'
        uses: actions/checkout@v4
        with:
          repository: mufflyt/isochrones
          ref: main
          path: isochrones-main
          token: ${{ secrets.CROSS_REPO_RO_TOKEN }}

      # canon_npi() and standardize_state_name() were promoted here so the three
      # repos would share ONE definition, but isochrones still carries its own
      # copies in R/join_standards.R and R/utils_standardized.R. Two live
      # implementations of a single source of truth is the drift this package
      # exists to prevent, and nothing compared them until now. The test
      # compares BEHAVIOUR, not text, so reformatting is free and a real change
      # in either copy fails loudly.
      - name: Promoted functions still match their isochrones originals
        if: steps.detect.outputs.has_token == 'true'
        env:
          MUFFLYACCESS_ISOCHRONES_DIR: ${{ github.workspace }}/isochrones-main
        run: >
          Rscript -e 'library(testthat);
          testthat::set_max_fails(Inf)
          res <- as.data.frame(testthat::test_dir("tests/testthat",
          filter = "promoted-origin-parity", stop_on_failure = TRUE));
          if (sum(res$passed) == 0) stop("parity guard ran no assertions -- it must not pass vacuously", call. = FALSE);
          cat("promoted-origin parity:", sum(res$passed), "assertions, OK\n")'

      - name: Validate + canonical invariants (strict, fail-closed)
        if: steps.detect.outputs.has_token == 'true'
        run: |
          Rscript -e '
            options(mufflyaccess.urps_artifact_strict = TRUE)
            library(mufflyaccess)
            path <- Sys.getenv("MUFFLYACCESS_URPS_ARTIFACT_DIR")
            stopifnot(nzchar(path), file.exists(file.path(path, "urps_counts_by_year.csv")))
            stopifnot(isTRUE(validate_urps_ssot(
              require_external = TRUE, require_canonical = TRUE,
              require_contract_version = "3.0.0",
              require_source_git_commit = Sys.getenv("ISO_SOURCE_COMMIT"))))
            use_urps_artifact(path)
            stopifnot(urps_count(2023, "board_certified_active", "national", TRUE)  == 1306L)
            stopifnot(urps_count(2023, "board_certified_active", "conus",    TRUE)  == 1303L)
            stopifnot(urps_count(2025, "roster_snapshot",        "national", TRUE)  == 1339L)
            stopifnot(urps_count(2025, "roster_snapshot",        "conus",    TRUE)  == 1336L)
            # retired cells never present as current
            stopifnot(!(urps_count(2023,"board_certified_active","national",TRUE) %in% c(1332L,1329L)))
            stopifnot(setequal(urps_retired_values(), c(1332L,1329L)))
            testthat::set_max_fails(Inf)
            testthat::set_max_fails(Inf)
            testthat::test_dir("tests/testthat", filter = "isochrones|contract-lineage", stop_on_failure = TRUE)
            cat("mufflyaccess integration: OK\n")
          '
      - name: Regenerate the ACS/Sheps package (self-invalidating) and check no drift
        if: steps.detect.outputs.has_token == 'true'
        run: |
          pip install pyarrow
          python3 share/acs_sheps/build_state_extract.py isochrones/artifacts/workforce/urps_provider_snapshot.parquet share/acs_sheps/out/urps_state_extract_2023_v3.0.0.csv
          MUFFLYACCESS_URPS_ARTIFACT_DIR=isochrones/artifacts/workforce Rscript share/acs_sheps/build_share_package.R
          git diff --exit-code -- share/acs_sheps/out || (echo "::error::share/acs_sheps outputs are stale; re-run the generators and commit"; exit 1)

  consumers:
    runs-on: ubuntu-latest
    # RULE: every job needs a timeout. A job timeout CANCELS the job,
    # so `if: always()` steps never run and no artifact survives.
    timeout-minutes: 30
    needs: mufflyaccess
    if: needs.mufflyaccess.outputs.has_token == 'true'   # skip cleanly when no cross-repo token
    strategy:
      # Report cliff and twostep independently: a failure in one is a finding
      # about that consumer, and cancelling the other just hides a second one.
      fail-fast: false
      matrix:
        include:
          # renv_exclude: packages to skip during restore. See the restore step.
          - repo: cliff
            renv_exclude: "GenSA,eulerr"
          - repo: twostep
            renv_exclude: ""
    steps:
      - name: Check out mufflyaccess
        uses: actions/checkout@v4
        with: { path: mufflyaccess }
      - name: Check out ${{ matrix.repo }}
        uses: actions/checkout@v4
        with:
          repository: mufflyt/${{ matrix.repo }}
          path: ${{ matrix.repo }}
          token: ${{ secrets.CROSS_REPO_RO_TOKEN }}
      - uses: r-lib/actions/setup-r@v2
        with: { use-public-rspm: true }
      # cliff and twostep are renv projects (.Rprofile + renv.lock + renv/).
      # renv activates a project library that shadows the site library, so the
      # usual setup-r-dependencies pass cannot be used here -- it fails with
      # "there is no package called 'pak'". Restore each consumer's own library
      # instead, so its dependencies are the ones it actually ships with.
      # The consumers pull the geospatial stack (sf, terra, s2, exactextractr,
      # units) plus doc/graphics packages, which need OS libraries the runner does
      # not ship -- without them restore fails with e.g. "libproj.so.25: cannot
      # open shared object file". renv prints the exact list it wants at restore
      # time, so if a consumer adds a dependency and this starts failing on a
      # missing .so, read the "required system packages" block in the log and
      # extend this list.
      - name: Install the consumers' system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake gdal-bin libabsl-dev libfontconfig1-dev libgdal-dev \
            libgeos-dev libpng-dev libudunits2-dev libx11-dev pandoc \
            libharfbuzz-dev libfribidi-dev libfreetype6-dev libtiff-dev \
            libjpeg-dev libcairo2-dev

      # Restored by hand rather than with setup-renv@v2, because that action
      # always restores the WHOLE lockfile and offers no way to skip a package.
      # renv::restore() installs everything recorded, so a dependency the
      # contract tests never touch can still block the job: cliff pins a GenSA
      # that no longer compiles on R >= 4.5 (Engine.cpp uses SET_TYPEOF, removed
      # from the API), and that takes eulerr down with it.
      #
      # Excluding the pair costs this job nothing. In cliff, eulerr is
      # Suggests-only, appears nowhere in R/ or tests/, and is used solely by
      # scripts/create_urps_taxonomy_euler.R -- which pkgload::load_all() never
      # sources, since it reads R/ only. None of the 17 tests matching the
      # contract filter reference it, and both packages are leaves in the
      # lockfile, so nothing else needs them. Excluding here rather than editing
      # cliff's lockfile keeps that lockfile honest about what its figure script
      # requires. See mufflyt/cliff#27 for the underlying incompatibility.
      - name: Cache the renv library
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.renv-cache
          key: renv-${{ matrix.repo }}-${{ runner.os }}-${{ hashFiles(format('{0}/renv.lock', matrix.repo)) }}
          restore-keys: renv-${{ matrix.repo }}-${{ runner.os }}-

      - name: Restore the consumer's renv library
        working-directory: ${{ matrix.repo }}
        env:
          RENV_PATHS_ROOT: ${{ github.workspace }}/.renv-cache
          RENV_EXCLUDE: ${{ matrix.renv_exclude }}
        run: |
          Rscript -e '
            excl <- trimws(strsplit(Sys.getenv("RENV_EXCLUDE"), ",")[[1]])
            excl <- excl[nzchar(excl)]
            if (length(excl)) {
              cat("excluding from restore:", paste(excl, collapse = ", "), "\n")
              renv::restore(exclude = excl, prompt = FALSE)
            } else {
              renv::restore(prompt = FALSE)
            }
          '

      # renv.lock pins mufflyaccess to an OLD commit -- cliff and twostep pin
      # DIFFERENT SHAs, both labelled 0.10.0, tens of commits behind main. The
      # restore above therefore installs that pinned build into the project
      # library, where it would shadow the version under test and quietly turn
      # this job into a check of stale code. Overwrite it with THIS checkout.
      # Install the consumer itself, so the tests below can attach it as a real
      # package instead of loading it from source. Deliberately BEFORE the
      # mufflyaccess install: installing the consumer resolves its dependencies
      # and can pull the lockfile-pinned mufflyaccess into the library, so the
      # checkout has to go in afterwards -- and the verify step after that is
      # then the last word on which build the tests will load.
      - name: Install the consumer package into its renv library
        working-directory: ${{ matrix.repo }}
        env:
          RENV_PATHS_ROOT: ${{ github.workspace }}/.renv-cache
        run: Rscript -e 'renv::install(".", prompt = FALSE)'

      # install.packages(repos = NULL) rather than renv::install(): given a local
      # directory renv still resolves it as a git remote and calls the GitHub
      # API for its DESCRIPTION, which fails on an unauthenticated/rate-limited
      # runner ("error downloading .../contents/DESCRIPTION [error code 22]").
      # Nothing here needs the network -- the package is on disk beside us.
      - name: Install this checkout of mufflyaccess into the renv library
        working-directory: ${{ matrix.repo }}
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Rscript -e '
            lib <- renv::paths$library()
            dir.create(lib, recursive = TRUE, showWarnings = FALSE)
            cat("installing into", lib, "\n")
            install.packages("../mufflyaccess", repos = NULL, type = "source", lib = lib)
            if (!nzchar(find.package("mufflyaccess", lib.loc = lib, quiet = TRUE)))
              stop("mufflyaccess did not land in the renv library", call. = FALSE)
          '

      # Fail loudly rather than test the wrong package. Comparing against the
      # lockfile's own pin is exact: if what R loads still carries that SHA, the
      # overwrite above did not take and every result below would be a false pass.
      - name: Verify the renv library holds THIS checkout, not the pinned build
        working-directory: ${{ matrix.repo }}
        run: |
          Rscript -e '
            lock   <- jsonlite::fromJSON("renv.lock")
            pinned <- lock$Packages$mufflyaccess$RemoteSha
            inst   <- packageDescription("mufflyaccess")$RemoteSha
            cat("library:", dirname(system.file(package = "mufflyaccess")), "\n")
            cat("version:", as.character(packageVersion("mufflyaccess")), "\n")
            cat("lockfile pin:", if (is.null(pinned)) "<none>" else substr(pinned, 1, 9), "\n")
            cat("loaded build:", if (is.null(inst)) "<local checkout>" else substr(inst, 1, 9), "\n")
            if (!is.null(pinned) && identical(inst, pinned))
              stop("the renv library still holds the lockfile-pinned build; the consumer contract tests would validate stale mufflyaccess", call. = FALSE)
            cat("OK: contract tests will load this checkout\n")
          '
      - name: Run the consumer's URPS contract + guard tests
        working-directory: ${{ matrix.repo }}
        run: |
          Rscript -e '
            library(testthat)
            # Attach the consumer as an INSTALLED package, then test_dir(). Both
            # consumers need this, for different reasons, and neither plain
            # test_dir() nor test_local() satisfies both:
            #
            #   test_dir() alone does not load the package under test, so
            #   twostep tests calling its own exports died with "could not find
            #   function urps_e2sfca_spar_summary".
            #
            #   test_local() loads via pkgload, which makes the test
            #   environment topenv the CONSUMER namespace. cliff imports
            #   data.table without setting .datatable.aware, so data.table
            #   cedta() returns FALSE and `[` silently degrades to data.frame
            #   semantics -- "could not find function \".\"" and NSE column
            #   references failing, in tests that pass in cliff own CI.
            #
            # Attaching the installed package puts topenv back at globalenv, so
            # data.table behaves, while the consumer exports are on the search
            # path. It also matches how each consumer actually ships.
            # mufflyaccess still resolves from the renv library -- the checkout
            # installed and verified above.
            pkg <- "${{ matrix.repo }}"
            library(pkg, character.only = TRUE)
            # Some consumer tests call UNEXPORTED helpers by bare name --
            # cliff test-workforce-baseline.R calls load_workforce_baseline(),
            # which is not in its NAMESPACE. load_all() would expose those, but
            # that is exactly what puts topenv on the package namespace and
            # breaks data.table. Attaching the namespace gives the same
            # visibility with topenv left at globalenv, so both hold at once.
            # (This filter is broader than cliff own contract job, which skips
            # these files; the extra coverage is worth keeping.)
            attach(asNamespace(pkg), name = paste0(pkg, ":internals"),
                   warn.conflicts = FALSE)
            cat(pkg, "attached from", dirname(system.file(package = pkg)), "\n")
            # Lift the failure cap here too: a capped consumer run reports a
            # PREFIX of the contract tests as though all had passed.
            testthat::set_max_fails(Inf)
            testthat::test_dir("tests/testthat",
              filter = "urps|baseline|unqualified|geography|engine|mufflyaccess", stop_on_failure = TRUE)
            cat(pkg, "consumer contract: OK\n")
          '
