name: tests

# Runs the FULL testthat suite on every push/PR. The existing
# isochrones-integration.yml only runs the isochrones|contract-lineage subset
# against a pinned upstream artifact; this gates everything else -- the URPS
# scenario dictionary, projection contract, FTE, demand, state-allocation,
# adversarial, boundary-value, and checkmate suites -- with the Suggests
# dependencies (checkmate / arrow / digest / nanoparquet) installed so the
# arrow-only and checkmate-only tests actually run instead of skipping.
#
# This job does NOT substitute for R-CMD-check.yaml: testthat never runs
# examples, and it does not look at Rd cross-references, non-ASCII source, the
# DESCRIPTION license pointer, or man/-vs-R/ drift. Those need `R CMD check`.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only: checkout + install + run the suite; no writes to the repo.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'          # Depends + Imports + Suggests (checkmate, arrow, ...)
          extra-packages: any::testthat
      - name: Install mufflyaccess
        run: R CMD INSTALL --with-keep.source .
      - name: Run the full testthat suite
        run: >
          Rscript -e 'library(testthat); library(mufflyaccess);
          testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'

  # The collaborator-facing share package must match what the CURRENT source
  # generates. isochrones-integration.yml already checks this, but only behind
  # CROSS_REPO_RO_TOKEN -- and build_share_package.R needs no cross-repo access
  # at all: it reads tests/testthat/fixtures/isochrones-v3.0.0 and no env var.
  # Gating it on that token meant the check did not run for two releases, and
  # share/acs_sheps/out shipped n_retired = 0 (a claimed absence of retirement)
  # where the answer is "not ascertained". This job is the token-free copy, so
  # the drift is caught on every push and on fork PRs.
  share-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
      # Install from THIS checkout. Generating against an older installed build
      # is precisely how the published outputs drifted: a stale library copy
      # still answering to 0.10.0 produced the pre-correction schema.
      - name: Install mufflyaccess from this checkout
        run: R CMD INSTALL --with-keep.source .
      - name: Regenerate share/acs_sheps and fail on drift
        run: |
          Rscript share/acs_sheps/build_share_package.R
          if ! git diff --exit-code -- share/acs_sheps/out; then
            echo "::error title=share/acs_sheps is stale::The committed collaborator-facing outputs do not match what the current source generates (diff above). Run 'Rscript share/acs_sheps/build_share_package.R' and commit the result. Check first whether the change is intended -- these files are consumed downstream, and a schema or missing-value change needs a NEWS entry."
            exit 1
          fi
