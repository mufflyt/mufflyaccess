name: tests

# Runs the FULL testthat suite on every push/PR. The existing
# isochrones-integration.yml only runs the isochrones|contract-lineage subset
# against a pinned upstream artifact; this gates everything else -- the URPS
# scenario dictionary, projection contract, FTE, demand, state-allocation,
# adversarial, boundary-value, and checkmate suites -- with the Suggests
# dependencies (checkmate / arrow / digest / nanoparquet) installed so the
# arrow-only and checkmate-only tests actually run instead of skipping.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'          # Depends + Imports + Suggests (checkmate, arrow, ...)
          extra-packages: any::testthat
      - name: Install mufflyaccess
        run: R CMD INSTALL --with-keep.source .
      - name: Run the full testthat suite
        run: >
          Rscript -e 'library(testthat); library(mufflyaccess);
          testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'
